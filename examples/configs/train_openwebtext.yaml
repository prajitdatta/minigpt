# MiniGPT-Forge Training Configuration
# Dataset: OpenWebText (~38GB)
# Full GPT-2 Small reproduction
#
# Author: Prajit Datta (https://github.com/prajitdatta)

model:
  name: gpt2-small
  vocab_size: 50257
  block_size: 1024
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.1

training:
  batch_size: 32
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_epochs: 50
  warmup_steps: 2000
  grad_clip: 1.0
  mixed_precision: true
  compile: true

optimizer:
  name: adamw
  betas: [0.9, 0.95]
  eps: 1.0e-8

scheduler:
  name: cosine
  min_lr: 3.0e-5

data:
  dataset: openwebtext
  train_path: data/openwebtext/train.bin
  val_path: data/openwebtext/val.bin
  num_workers: 4
  pin_memory: true

logging:
  wandb_project: minigpt-forge
  log_interval: 10
  eval_interval: 500
  save_interval: 1000
