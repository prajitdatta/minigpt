# MiniGPT-Forge Training Configuration
# Dataset: Tiny Shakespeare (~1MB)
# Quick demo — trains in ~5 minutes on a single GPU
#
# Author: Prajit Datta (https://github.com/prajitdatta)

model:
  name: gpt2-small
  vocab_size: 50257
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.2

training:
  batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-3
  weight_decay: 0.1
  max_epochs: 20
  warmup_steps: 100
  grad_clip: 1.0
  mixed_precision: true

optimizer:
  name: adamw
  betas: [0.9, 0.99]
  eps: 1.0e-8

scheduler:
  name: cosine
  min_lr: 1.0e-4

data:
  path: data/shakespeare.txt
  num_workers: 2
  pin_memory: true

logging:
  log_interval: 10
  eval_interval: 250
  save_interval: 500
