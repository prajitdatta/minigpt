[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt-forge"
version = "0.4.2"
description = "Build, Train & Deploy GPT Models from Scratch — Lightweight, Hackable, Production-Ready"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Prajit Datta", email = "prajitdatta@users.noreply.github.com"},
]
keywords = ["gpt", "transformer", "language-model", "deep-learning", "pytorch", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "regex>=2023.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "pydantic>=2.0"]
tiktoken = ["tiktoken>=0.5.0"]
wandb = ["wandb>=0.15.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "minigpt-forge[api,tiktoken,wandb]",
]
all = ["minigpt-forge[api,tiktoken,wandb,dev]"]

[project.urls]
Homepage = "https://github.com/prajitdatta/MiniGPT-Forge"
Documentation = "https://prajitdatta.github.io/"
Repository = "https://github.com/prajitdatta/MiniGPT-Forge"
Issues = "https://github.com/prajitdatta/MiniGPT-Forge/issues"

[project.scripts]
minigpt-train = "scripts.train:main"
minigpt-generate = "scripts.generate:main"

[tool.setuptools.packages.find]
include = ["minigpt*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
